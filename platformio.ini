[platformio]

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps = 
    fastled/FastLED
    mathertel/OneButton
    spacehuhn/SimpleCLI

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_raw = yes